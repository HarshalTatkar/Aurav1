name: aura
description: "AURA — AI-Powered Personal Health Companion for Real-Time, Privacy-Preserving Health Monitoring and Early Warning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # BLE
  flutter_blue_plus: ^1.35.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # HTTP Client
  dio: ^5.8.0+1

  # WebSocket
  web_socket_channel: ^3.0.2

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Location
  geolocator: ^13.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Typography
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.4.0

  # Loading effects
  shimmer: ^3.0.0

  # UUID
  uuid: ^4.5.1
  animated_text_kit: ^4.3.0
  animated_flip_counter: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
